<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Lojão da Aura</title>
</head>
<body>

    <nav>
        <a href="{{ url_for('index') }}">Início</a>
        <a href="{{ url_for('produtos') }}">Produtos</a>
        <a href="{{ url_for('sobre') }}">Sobre</a>
    </nav>

    <h1>Produtos</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Preço</th>
                <th>Categoria</th>
            </tr>
        </thead>
        <tbody>
            {% for p in produtos %}
            <tr>
                <td>{{ p.nome }}</td>
                <td>R$ {{ "%.2f"|format(p.preco) }}</td>
                <td>{{ p.categoria }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
